[project]
name = "maibot-plugin-longhub"
version = "0.7.0"
description = "A webhook-synchronized, remote-only LONG Hub meme catalog for MaiBot"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11.18,<4",
    "aiosqlite>=0.21,<1",
    "maibot-plugin-sdk>=2.20,<3",
    "pillow>=11.2.1",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[dependency-groups]
browser = [
    "playwright>=1.55,<2",
]
dev = [
    "jsonschema>=4.23,<5",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.test-tmp"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache", ".uv-python", ".test-tmp", ".preview-data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
